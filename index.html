<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fin Controller</title>
<meta name="description" content="Controle financeiro pessoal — grupos livres, receita e relatórios mensais.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a141e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fin Controller">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">🌸</div>
      <span class="brand-name">Fin Controller</span>
    </div>
  </header>

  <div class="month-nav">
    <button id="prevMonth" aria-label="Mês anterior">‹</button>
    <span class="month-label display" id="monthLabel">—</span>
    <button id="nextMonth" aria-label="Próximo mês">›</button>
  </div>

  <!-- ABA: INÍCIO (dashboard) -->
  <section class="tab-panel active" id="tab-dashboard">
    <section class="hero">
      <div class="hero-label">Saldo do mês</div>
      <div class="hero-value display" id="heroValue">R$ 0,00</div>
      <div class="hero-sub">
        <div class="hero-sub-item income">
          <div class="k">Receita</div>
          <div class="v" id="incomeTotalDisplay">R$ 0,00</div>
        </div>
        <div class="hero-sub-item expense">
          <div class="k">Despesas</div>
          <div class="v" id="expenseTotalDisplay">R$ 0,00</div>
        </div>
      </div>
    </section>

    <div class="card">
      <div class="card-title">
        <h2>Receita</h2>
        <span class="hint">deste mês</span>
      </div>
      <div class="field-row">
        <label for="monthlyIncomeInput">Renda mensal</label>
        <div class="income-input-wrap">
          <input type="number" step="0.01" id="monthlyIncomeInput" placeholder="0,00">
        </div>
      </div>
      <div class="extra-list" id="extraList"></div>
      <button class="link-btn" id="addExtraBtn">+ adicionar entrada extra</button>
    </div>

    <div class="card">
      <div class="card-title">
        <h2>Distribuição dos gastos</h2>
        <span class="hint">deste mês</span>
      </div>
      <div id="donutWrap"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <h2>Gasto por grupo</h2>
        <span class="hint">toque para abrir</span>
      </div>
      <div id="groupCardsWrap" class="group-cards-grid"></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>Histórico</h2></div>
      <div id="historyWrap"></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>Backup dos dados</h2></div>
      <p class="empty-hint" style="margin-bottom:14px;">Os dados ficam salvos só neste aparelho. Exporte de vez em quando para não perder nada.</p>
      <div class="secondary-actions">
        <button class="secondary-btn" id="backupBtn">Exportar backup</button>
        <label class="secondary-btn" style="text-align:center;cursor:pointer;">
          Importar backup
          <input type="file" id="restoreInput" accept="application/json" style="display:none;">
        </label>
      </div>
      <button class="link-btn" id="reportBtn" style="margin-top:10px;">Gerar relatório do mês (PDF)</button>
    </div>
  </section>

  <!-- ABAS: uma por grupo (geradas dinamicamente) -->
  <div id="groupPanelsWrap"></div>

</div>

<!-- NAV INFERIOR (gerado dinamicamente conforme os grupos) -->
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Printable report (hidden on screen, shown on print) -->
<div class="report-view" id="reportView"></div>

<script src="app.js"></script>
</body>
</html>
